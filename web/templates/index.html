<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANALYST — 券商報告研究終端</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body>
    <div class="grain-overlay"></div>

    <div id="app">
        <!-- 手機版側邊欄遮罩 -->
        <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

        <!-- 側邊欄：歷史對話 -->
        <aside id="sidebar">
            <div class="sidebar-brand">
                <div class="brand-mark">A</div>
                <div class="brand-text">
                    <span class="brand-name">ANALYST</span>
                    <span class="brand-sub">Research Terminal</span>
                </div>
                <span id="stats-badge" class="stats-badge"></span>
                <button id="sidebar-close" class="sidebar-close-btn" title="關閉側邊欄">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>

            <div class="sidebar-actions">
                <button id="new-chat-btn" class="new-chat-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    新對話
                </button>
            </div>

            <div class="sidebar-section-label">歷史對話</div>

            <div id="conversation-list" class="conversation-list">
                <!-- 動態填入 -->
            </div>
        </aside>

        <!-- 主聊天區 -->
        <main id="chat-area">
            <div class="chat-header">
                <button id="toggle-sidebar" class="icon-btn" title="切換側邊欄">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg>
                </button>
                <div class="header-title-group">
                    <h1>Research <em>Assistant</em></h1>
                    <div class="header-divider"></div>
                </div>
                <div class="stock-filter">
                    <label for="stock-filter">FILTER</label>
                    <input type="text" id="stock-filter" placeholder="股票代碼">
                </div>
                <button id="toggle-related" class="icon-btn" title="相關報告">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                </button>
            </div>

            <div id="messages" class="messages">
                <!-- welcome 由 JS 注入 -->
            </div>

            <div class="input-area">
                <!-- 匯入的資料來源 chips -->
                <div id="imported-sources" class="imported-sources"></div>

                <div class="input-wrap">
                    <button id="attach-btn" class="attach-btn" title="匯入資料">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
                        </svg>
                    </button>
                    <textarea id="user-input" placeholder="輸入你的研究問題..." rows="1"></textarea>
                    <button id="send-btn" title="送出">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                    </button>
                </div>
                <div class="input-bottom-row">
                    <div class="source-toggles">
                        <label class="source-toggle">
                            <input type="checkbox" id="toggle-broker" checked>
                            <span class="toggle-pill">📋 券商報告</span>
                        </label>
                        <label class="source-toggle">
                            <input type="checkbox" id="toggle-financial">
                            <span class="toggle-pill">📊 財報</span>
                        </label>
                        <label class="source-toggle">
                            <input type="checkbox" id="toggle-earnings">
                            <span class="toggle-pill">🎤 法說會</span>
                        </label>
                        <label class="source-toggle">
                            <input type="checkbox" id="toggle-web">
                            <span class="toggle-pill">🌐 外網資料</span>
                        </label>
                    </div>
                    <div class="input-hint">Enter 送出 · Shift+Enter 換行</div>
                </div>
            </div>
        </main>

        <!-- 右側欄：相關報告 -->
        <div id="related-backdrop" class="related-backdrop"></div>
        <aside id="related-panel" class="related-panel collapsed">
            <div class="related-panel-header">
                <span class="related-panel-title">相關報告</span>
                <button id="close-related" class="sidebar-close-btn" style="display:flex" title="關閉">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="related-sort-tabs">
                <button class="related-sort active" data-sort="relevance" onclick="sortRelated('relevance', this)">關聯高</button>
                <button class="related-sort" data-sort="pages" onclick="sortRelated('pages', this)">頁數多</button>
                <button class="related-sort" data-sort="first-coverage" onclick="sortRelated('first-coverage', this)">初次覆蓋</button>
            </div>
            <div id="related-list" class="related-list">
                <div class="related-empty">送出問題後，這裡會顯示相關報告</div>
            </div>
        </aside>
    </div>

    <!-- 匯入資料彈出選單 -->
    <div id="attach-menu" class="attach-menu hidden">
        <button class="attach-menu-item" onclick="triggerFileUpload()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            上傳檔案
            <span class="attach-hint">PDF, TXT, CSV</span>
        </button>
        <button class="attach-menu-item" onclick="promptUrlImport()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
            匯入網址
            <span class="attach-hint">自動擷取內容</span>
        </button>
    </div>
    <input type="file" id="file-upload" style="display:none" accept=".pdf,.txt,.csv,.json,.md">

    <!-- Hover 彈出卡片 -->
    <div id="source-popover" class="source-popover hidden">
        <div class="popover-accent-line"></div>
        <div class="popover-header">
            <span class="popover-broker"></span>
            <span class="popover-date"></span>
        </div>
        <div class="popover-meta">
            <span class="popover-stock"></span>
            <span class="popover-rating"></span>
            <span class="popover-tp"></span>
        </div>
        <div class="popover-excerpt"></div>
        <div class="popover-footer">
            <a href="#" class="popover-detail-link">
                查看完整報告
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </a>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
